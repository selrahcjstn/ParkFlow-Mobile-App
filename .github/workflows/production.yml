name: Production CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  publish-update:
    name: Publish OTA Update
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish EAS Update (Preview)
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          CLEAN_MSG=$(echo "$COMMIT_MSG" | head -n 1 | tr -d '"`$()')
          eas update --branch preview --message "Automated OTA update - $CLEAN_MSG" --non-interactive

      - name: Publish EAS Update (Production)
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          CLEAN_MSG=$(echo "$COMMIT_MSG" | head -n 1 | tr -d '"`$()')
          eas update --branch production --message "Automated OTA update - $CLEAN_MSG" --non-interactive

  build-binary:
    name: Build Native Binaries
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Standalone Preview App (Android APK)
        run: eas build --profile preview --platform android --non-interactive
