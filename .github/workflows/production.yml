name: Production CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  publish-update:
    name: Publish OTA Update
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Create Environment File
        run: |
          cat << 'EOF' > .env
          EXPO_PUBLIC_API_URL=http://54.90.173.98:5000/api
          EXPO_PUBLIC_MS_CLIENT_ID=7075e648-9e9f-4263-b8d8-109ad880696b
          EXPO_PUBLIC_MS_TENANT_ID=cceb61f2-e867-476f-8597-b4cf22555bc4
          EOF

      - name: Publish EAS Update (Preview)
        env:
          EXPO_PUBLIC_API_URL: http://54.90.173.98:5000/api
          EXPO_PUBLIC_MS_CLIENT_ID: 7075e648-9e9f-4263-b8d8-109ad880696b
          EXPO_PUBLIC_MS_TENANT_ID: cceb61f2-e867-476f-8597-b4cf22555bc4
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          CLEAN_MSG=$(echo "$COMMIT_MSG" | head -n 1 | tr -d '"`$()')
          eas update --channel preview --message "Automated OTA update - $CLEAN_MSG" --non-interactive

  build-binary:
    name: Build Native Binaries
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build Standalone Preview App (Android APK)
        run: eas build --profile preview --platform android --non-interactive

